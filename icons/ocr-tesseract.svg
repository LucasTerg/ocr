<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f9e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Tło -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#bg)"/>
  
  <!-- Dokument -->
  <rect x="14" y="10" width="24" height="30" rx="2" fill="white" opacity="0.9"/>
  <rect x="14" y="10" width="24" height="6" rx="2" fill="#e8e8e8"/>
  
  <!-- Linie tekstu -->
  <rect x="18" y="20" width="16" height="2" rx="1" fill="#555"/>
  <rect x="18" y="25" width="14" height="2" rx="1" fill="#555"/>
  <rect x="18" y="30" width="12" height="2" rx="1" fill="#555"/>
  <rect x="18" y="35" width="15" height="2" rx="1" fill="#555"/>
  
  <!-- Lupka -->
  <circle cx="42" cy="38" r="12" fill="none" stroke="white" stroke-width="3"/>
  <line x1="50" y1="48" x2="56" y2="54" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Litera T w lupce -->
  <text x="42" y="43" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="white">T</text>
  
  <!-- Strzałka zaznaczenia -->
  <line x1="8" y1="52" x2="20" y2="40" stroke="#ffcc00" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="8" cy="52" r="3" fill="#ffcc00"/>
</svg>
